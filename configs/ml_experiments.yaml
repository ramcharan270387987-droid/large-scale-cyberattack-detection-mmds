{
  "version": "phase4-v1",
  "seed": 23013,
  "group_sample_permyriad": 625,
  "score_bins": 2048,
  "threshold": 0.5,
  "rare_family_minimum": 100,
  "numerical_features": [
    "flow_duration", "tot_fwd_pkts", "tot_bwd_pkts", "totlen_fwd_pkts", "totlen_bwd_pkts",
    "pkt_len_mean", "pkt_len_std", "flow_iat_mean", "flow_iat_std", "fwd_iat_mean",
    "bwd_iat_mean", "flow_pkts_s", "flow_byts_s", "down_up_ratio",
    "syn_flag_cnt", "ack_flag_cnt", "rst_flag_cnt", "fin_flag_cnt"
  ],
  "high_missingness_excluded": ["init_fwd_win_byts", "init_bwd_win_byts"],
  "optional_categorical": ["protocol"],
  "random_permyriad": {"train": 7000, "validation": 1500, "test": 1500},
  "protocols": {
    "A": {"name": "predictor-group random"},
    "B": {
      "name": "chronological capture-day holdout",
      "train": ["2018-02-14", "2018-02-15", "2018-02-16", "2018-02-20", "2018-02-21", "2018-02-22"],
      "validation": ["2018-02-23", "2018-02-28"],
      "test": ["2018-03-01", "2018-03-02"]
    },
    "C": {
      "name": "web-attack capture holdout",
      "train": ["2018-02-14", "2018-02-15", "2018-02-16", "2018-02-20", "2018-02-21", "2018-03-01", "2018-03-02"],
      "validation": ["2018-02-28"],
      "test": ["2018-02-22", "2018-02-23"]
    }
  },
  "trials": {
    "logistic_regression": [
      {"maxIter": 12, "regParam": 0.005, "elasticNetParam": 0.0},
      {"maxIter": 12, "regParam": 0.05, "elasticNetParam": 0.0}
    ],
    "random_forest": [
      {"numTrees": 12, "maxDepth": 5, "minInstancesPerNode": 30},
      {"numTrees": 20, "maxDepth": 7, "minInstancesPerNode": 30}
    ],
    "gradient_boosted_trees": [
      {"maxIter": 6, "maxDepth": 3, "stepSize": 0.1},
      {"maxIter": 10, "maxDepth": 4, "stepSize": 0.15}
    ]
  },
  "spark": {"master": "local[4]", "driver_memory": "8g", "shuffle_partitions": 48, "input_partition_bytes": 67108864}
}
